syntax = "proto3";

package ayoprotoschemas;

import "google/protobuf/timestamp.proto";
import "address.proto";
import "meta.proto";

// Top-level Order message
message Order {
  option(meta.msg_type) = "entity";
  option(meta.msg_routing_key) = "orders";
  option(meta.msg_exchange) = "events";
  // Unique identifier of the order
  string order_id = 1;

  // Identifier of the user who placed the order
  string user_id = 2;

  // A list of items included in the order
  repeated OrderItem items = 3;

  // Shipping address for the order
  Address shipping_address = 4;

  // Billing address for the order
  Address billing_address = 5;

  // The total amount for the order
  double total_amount = 6;

  // Current status of the order
  OrderStatus status = 7;

  // Timestamps
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Represents a single item within an order
message OrderItem {
  // The product's unique identifier
  string product_id = 1;

  // Quantity of the product
  int32 quantity = 2;

  // Price per unit of the product
  double price = 3;

  // (Optional) Precomputed total price for this item
  double total_price = 4;
}


// Enum for the status of an order
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  SHIPPED = 2;
  DELIVERED = 3;
  CANCELLED = 4;
}
